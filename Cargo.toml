[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Yokiwa/cairn"
authors = ["Yokiwa"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
futures = "0.3"
tokio-util = "0.7"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
wiremock = "0.6"
regex = "1"
